packages:
  - apps/*
  - oxlint-plugin-threadlines
  - packages/*
  - scripts

catalog:
  "@anthropic-ai/claude-agent-sdk": ^0.3.310
  "@anthropic-ai/sdk": ^1.3.0
  "@effect/atom-react": 4.0.0-beta.107
  "@effect/openapi-generator": 4.0.0-beta.107
  "@effect/platform-bun": 4.0.0-beta.107
  "@effect/platform-node": 4.0.0-beta.107
  "@effect/platform-node-shared": 4.0.0-beta.107
  "@effect/sql-sqlite-bun": 4.0.0-beta.107
  "@effect/tsgo": 0.53.4
  "@effect/vitest": 4.0.0-beta.107
  "@github/copilot-sdk": 1.0.26
  "@pierre/diffs": 1.6.1
  "@types/bun": ^1.4.4
  "@types/node": ^24.19.2
  "@vitest/browser-playwright": 5.0.5
  effect: 4.0.0-beta.107
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  yaml: ^2.9.1

ignoredBuiltDependencies:
  - msw

ignoredOptionalDependencies:
  - global-agent

onlyBuiltDependencies:
  - electron
  - esbuild
  - msgpackr-extract
  - node-pty
  - sharp

overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-sqlite-bun": "catalog:"
  "@effect/vitest": "catalog:"
  "@hono/node-server": 2.0.11
  "@types/node": "catalog:"
  "@xmldom/xmldom@0.8": 0.8.15
  brace-expansion: 5.0.12
  effect: "catalog:"
  fast-uri: 3.1.9
  js-yaml@4: 4.3.2
  # Keep remark-math's nested KaTeX on the fixed version used by chat.
  "micromark-extension-math>katex": 0.19.1
  nanoid@3: 3.3.18
  postcss: 8.5.31
  sharp: 0.35.5
  tar: 7.5.22
  tinypool@2.1.0: 2.1.2
  undici@7: 7.30.1
  undici@8: 8.12.3
  yaml: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # @github/copilot-sdk pins zod 4.3.6 exactly (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6).
  zod@4.3.6: ^4.6.7

packageExtensions:
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  # Child stdin and input fds keep an "error" listener after their writer stops.
  # Otherwise a child that exits with unread input resets the pipe and crashes the server.
  "@effect/platform-node-shared@4.0.0-beta.107": patches/@effect__platform-node-shared@4.0.0-beta.107.patch
  "@legendapp/list@3.3.9": patches/@legendapp__list@3.3.9.patch
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
  effect@4.0.0-beta.107: patches/effect@4.0.0-beta.107.patch
  lexical@0.49.0: patches/lexical@0.49.0.patch

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    "@opencode/client>effect": "*"
    "@voidzero-dev/vite-plus-core>typescript": "7"
    vite: "*"
    vitest: "*"
