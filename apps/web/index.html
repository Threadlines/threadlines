<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- iPhone and iPad zoom the page into any text field whose text is under
         16px, and the app's fields are mostly 13px. A maximum scale of 1 stops
         that zoom; in Safari a pinch still zooms, since iOS ignores the limit
         for gestures. Apple touch screens only: Android applies the limit to
         pinches too, and never zooms into fields anyway. An iPad reports
         itself as a Mac, so a Mac with a touch screen counts. -->
    <script>
      (() => {
        const userAgent = navigator.userAgent;
        const appleTouchScreen =
          /\b(?:iPhone|iPad|iPod)\b/.test(userAgent) ||
          (/\bMacintosh\b/.test(userAgent) && navigator.maxTouchPoints > 1);
        if (!appleTouchScreen) return;
        const viewport = document.querySelector('meta[name="viewport"]');
        const content = viewport?.getAttribute("content");
        if (content) viewport.setAttribute("content", `${content}, maximum-scale=1`);
      })();
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable: "Add to Home Screen" opens it as its own full-screen app.
         The manifest names it after its channel; the status bar follows the
         theme-color above. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- First paint in the device's theme. Built-ins as always; a custom theme
         (a JSON choice, see src/theme/themeChoice.ts) paints from the small
         record the theme store keeps for it: its base, opaque surface and
         tokens. System with a theme for each mode paints the side the
         computer is on from that side's record, else that mode's built-in.
         `?theme=default` skips the saved choice for this load. -->
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const setThemeColor = (color) => {
          const metas = document.querySelectorAll('meta[name="theme-color"]');
          let active = metas[0];
          if (!active) {
            active = document.createElement("meta");
            active.name = "theme-color";
            document.head.append(active);
          }
          for (let i = 1; i < metas.length; i += 1) metas[i].remove();
          active.removeAttribute("media");
          active.setAttribute("data-dynamic-theme-color", "true");
          active.setAttribute("content", color);
        };
        const prefersDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
        const paintCustomTheme = (raw) => {
          if (!raw || raw.charAt(0) !== "{") return false;
          const stored = JSON.parse(raw);
          if (!stored) return false;
          const pair =
            stored.kind === "builtin" &&
            stored.id === "system" &&
            typeof stored.light === "object" &&
            typeof stored.dark === "object";
          const mode = prefersDark() ? "dark" : "light";
          // A pair's built-in side is its mode's built-in: System paints it below.
          const choice = pair ? stored[mode] : stored;
          if (!choice) return false;
          const record = JSON.parse(
            window.localStorage.getItem(
              pair ? "threadlines:theme-paint:" + mode : "threadlines:theme-paint",
            ) || "null",
          );
          if (!record || record.v !== 1 || typeof record.tokens !== "object") return false;
          const key =
            choice.kind === "starter"
              ? "starter:" + choice.id
              : choice.kind === "library"
                ? "library:" + choice.entryId + ":" + choice.hash
                : choice.kind === "unsaved" && !pair
                  ? "unsaved:" + choice.hash
                  : null;
          if (key === null || record.key !== key) return false;
          const safe = (value) => /^[#a-zA-Z0-9(). ,%/-]+$/.test(String(value));
          let declarations = "";
          for (const name in record.tokens) {
            if (/^[a-z0-9-]+$/.test(name) && safe(record.tokens[name])) {
              declarations += "--" + name + ":" + record.tokens[name] + ";";
            }
          }
          if (!safe(record.surface) || !safe(record.tokens.foreground)) return false;
          const root = document.documentElement;
          const style = document.createElement("style");
          style.id = "tl-theme";
          style.textContent =
            "html:root[data-theme]{" +
            declarations +
            "}html:root[data-theme] body{background:" +
            record.surface +
            ";color:" +
            record.tokens.foreground +
            "}";
          document.head.append(style);
          root.setAttribute("data-theme", "custom");
          root.setAttribute("data-theme-version", record.hash || "pending");
          root.classList.toggle("dark", record.base === "dark");
          root.style.backgroundColor = record.surface;
          setThemeColor(record.surface);
          return true;
        };
        try {
          const storedThreadlinesTheme = window.localStorage.getItem("threadlines:theme");
          const bypass = new URLSearchParams(window.location.search).get("theme") === "default";
          if (!bypass && paintCustomTheme(storedThreadlinesTheme)) return;
          const storedLegacyTheme = window.localStorage.getItem("t3code:theme");
          // A saved choice this script couldn't paint (a JSON one) paints as
          // System; only a device with no choice yet reads the legacy key.
          const storedTheme =
            storedThreadlinesTheme === null ? storedLegacyTheme : storedThreadlinesTheme;
          if (
            storedThreadlinesTheme === null &&
            (storedLegacyTheme === "light" ||
              storedLegacyTheme === "dark" ||
              storedLegacyTheme === "system")
          ) {
            window.localStorage.setItem("threadlines:theme", storedLegacyTheme);
          }
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const isDark = theme === "dark" || (theme === "system" && prefersDark());
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          setThemeColor(chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          setThemeColor(DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "Schibsted Grotesk Variable",
          "Schibsted Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>Threadlines</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Threadlines splash screen">
          <img id="boot-shell-logo" src="/splash-icon.png" alt="Threadlines" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
