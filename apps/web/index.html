<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- iPhone and iPad zoom the page into any text field whose text is under
         16px, and the app's fields are mostly 13px. A maximum scale of 1 stops
         that zoom; in Safari a pinch still zooms, since iOS ignores the limit
         for gestures. Apple touch screens only: Android applies the limit to
         pinches too, and never zooms into fields anyway. An iPad reports
         itself as a Mac, so a Mac with a touch screen counts. -->
    <script>
      (() => {
        const userAgent = navigator.userAgent;
        const appleTouchScreen =
          /\b(?:iPhone|iPad|iPod)\b/.test(userAgent) ||
          (/\bMacintosh\b/.test(userAgent) && navigator.maxTouchPoints > 1);
        if (!appleTouchScreen) return;
        const viewport = document.querySelector('meta[name="viewport"]');
        const content = viewport?.getAttribute("content");
        if (content) viewport.setAttribute("content", `${content}, maximum-scale=1`);
      })();
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable: "Add to Home Screen" opens it as its own full-screen app.
         The manifest names it after its channel; the status bar follows the
         theme-color above. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedThreadlinesTheme = window.localStorage.getItem("threadlines:theme");
          const storedLegacyTheme = window.localStorage.getItem("t3code:theme");
          const storedTheme =
            storedThreadlinesTheme === "light" ||
            storedThreadlinesTheme === "dark" ||
            storedThreadlinesTheme === "system"
              ? storedThreadlinesTheme
              : storedLegacyTheme;
          if (
            storedThreadlinesTheme === null &&
            (storedLegacyTheme === "light" ||
              storedLegacyTheme === "dark" ||
              storedLegacyTheme === "system")
          ) {
            window.localStorage.setItem("threadlines:theme", storedLegacyTheme);
          }
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "Schibsted Grotesk Variable",
          "Schibsted Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>Threadlines</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Threadlines splash screen">
          <img id="boot-shell-logo" src="/splash-icon.png" alt="Threadlines" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
