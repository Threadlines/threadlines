name: Bug report
description: Something in Threadlines is broken, stuck or wrong.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A quick look through open issues helps us avoid duplicates, and one problem per report is easiest to fix.

        This page is public, so leave out private project names, file paths and keys.

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      placeholder: I changed the access level and the app jumped to a different chat.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: Rough steps are fine. If it only happened once, say that.
      placeholder: |
        1. Open a chat and type a message without sending it
        2. Change the access level to Full access
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › General › Privacy & about › Version. If you run from source, a commit works too.
      placeholder: 0.8.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Your setup
      description: Your computer, how you use Threadlines (desktop app, browser or phone), and the agent if it matters.
      placeholder: Windows 11, desktop app, Claude
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: Skip this if it's obvious.

  - type: textarea
    id: logs
    attributes:
      label: Error text or logs
      description: Paste only the part that matters, and remove anything private.
      render: shell

  - type: upload
    id: attachments
    attributes:
      label: Screenshots or recordings
      description: Check them for anything private before you upload.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.log,.txt,.json,.zip"
