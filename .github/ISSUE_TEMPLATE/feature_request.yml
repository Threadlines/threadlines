name: Feature request
description: Something you'd like Threadlines to do, or do better.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you hit, then the change you'd like. A quick look through open issues helps us avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do, and what gets in the way?
      placeholder: I keep several threads going, and the list reorders itself while I'm working.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead?
      placeholder: Let me drag threads into my own order and keep them there.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Anything else?
      description: Screenshots, links, or how another tool handles it.

  - type: checkboxes
    id: contribution
    attributes:
      label: Want to build it?
      description: Tick this and we can agree on the approach before you start.
      options:
        - label: I'd be open to helping build this.
