version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # Dependabot mishandles this pnpm catalog entry (drops it from the
      # catalog and hardcodes the lockfile importer), producing unmergeable
      # PRs. The typecheck toolchain is bumped manually instead.
      - dependency-name: "@effect/tsgo"
      # Same catalog-hardcoding bug (PR #75 rewrote the root importer's
      # 'catalog:' specifier to a literal 0.2.5, breaking frozen-lockfile
      # installs). vite-plus must also move in lockstep with the `vite`
      # catalog alias (@voidzero-dev/vite-plus-core) and the setup-vp pins
      # in CI workflows, so it is bumped manually as a coordinated change.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      # Electron bumps can regress GPU compositing in ways CI cannot catch
      # (43.1.1 produced stale-tile strips at the sidebar boundary on
      # Windows). Bump manually and soak on real hardware first.
      - dependency-name: "electron"
      # Playwright upgrades change private injected engine source that is
      # vendored for the desktop preview. Bump both packages together and
      # regenerate the checked-in artifacts with vendor:playwright.
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"
      # effect core is patched (patches/effect@4.0.0-beta.97.patch and
      # patches/@effect__platform-node-shared@4.0.0-beta.97.patch), and the
      # effect beta packages must move in lockstep — bumping satellites alone
      # (PRs #78/#79) splits the ecosystem across two betas. Bumped manually
      # as one coordinated upgrade.
      - dependency-name: "effect"
      - dependency-name: "@effect/*"
      # lexical is patched for spellcheck (patches/lexical@0.47.0.patch);
      # bumping @lexical/react alone breaks typecheck against the pinned
      # core (PR #85). Bump manually, re-cutting the patch, until the
      # upstream lexical spellcheck PR lands.
      - dependency-name: "lexical"
      - dependency-name: "@lexical/*"
      # TypeScript majors (7.x) and @types/node majors are coordinated
      # migrations: TS 7 needs its own investigation pass, and @types/node
      # must track the Node 22 engines floor, not the newest release.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
