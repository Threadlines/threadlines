version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # Dependabot mishandles this pnpm catalog entry (drops it from the
      # catalog and hardcodes the lockfile importer), producing unmergeable
      # PRs. The typecheck toolchain is bumped manually instead.
      - dependency-name: "@effect/tsgo"
      # Same catalog-hardcoding bug (PR #75 rewrote the root importer's
      # 'catalog:' specifier to a literal 0.2.5, breaking frozen-lockfile
      # installs). vite-plus must also move in lockstep with the `vite`
      # catalog alias (@voidzero-dev/vite-plus-core), so it is bumped
      # manually as a coordinated change. CI's setup-vp reads the version
      # from the catalog, so the workflows follow on their own.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      # Electron bumps can regress GPU compositing in ways CI cannot catch
      # (43.1.1 produced stale-tile strips at the sidebar boundary on
      # Windows). Bump manually and soak on real hardware first.
      - dependency-name: "electron"
      # Playwright upgrades change private injected engine source that is
      # vendored for the desktop preview. Bump both packages together and
      # regenerate the checked-in artifacts with vendor:playwright.
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"
      # effect and its @effect/* packages must move in lockstep: bumping
      # satellites alone (PRs #78/#79) split the ecosystem across two
      # versions. CI also checks the vendored source in .repos/effect, so
      # bump manually as one coordinated upgrade, followed by
      # scripts/sync-effect-source.ts.
      - dependency-name: "effect"
      - dependency-name: "@effect/*"
      # @legendapp/list is patched for chat scrolling
      # (patches/@legendapp__list@3.3.9.patch) and pinned to that exact
      # version. pnpm refuses to resolve a bump while the patch names the old
      # version (ERR_PNPM_UNUSED_PATCH), which failed the whole
      # production-dependencies job on every run. Bump manually, re-cutting
      # the patch, and check the chat timeline in a browser.
      - dependency-name: "@legendapp/list"
      # TypeScript is pinned to an exact version @effect/tsgo ships a patched
      # compiler for (`effect-tsgo patch` fails the install on any other), so
      # it moves only together with @effect/tsgo. This also holds the
      # marketing site's TypeScript 5.9, kept for astro check. @types/node
      # majors are a coordinated migration: it tracks the Node line CI runs
      # (the workflows' setup-vp node-version) and Electron ships.
      - dependency-name: "typescript"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # lexical and its @lexical/* packages ship in lockstep: bumping
      # @lexical/react alone breaks typecheck against the core (PR #85). One
      # group for every update type, majors too, listed first so it wins.
      lexical:
        patterns:
          - "lexical"
          - "@lexical/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
