name: npm Package

on:
  pull_request:
    paths:
      - ".github/workflows/npm-package.yml"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional package version to publish. Blank uses apps/server/package.json."
        required: false
        type: string
      dist_tag:
        description: "npm dist-tag for publishing."
        required: true
        default: latest
        type: choice
        options:
          - latest
          - nightly
      publish:
        description: "Publish to npm. Leave false for a dry run."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pack:
    name: Build and dry-run package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.smoke_pack.outputs.version }}
      tarball: ${{ steps.smoke_pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: vp install --frozen-lockfile

      - name: Align package versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Build server package
        env:
          THREADLINES_POSTHOG_KEY: ${{ secrets.THREADLINES_POSTHOG_KEY }}
          THREADLINES_POSTHOG_HOST: ${{ vars.THREADLINES_POSTHOG_HOST }}
          THREADLINES_TELEMETRY_ENABLED: ${{ vars.THREADLINES_TELEMETRY_ENABLED }}
        run: vp exec vp run --filter @threadlines/server build

      - name: Prepare npm package
        run: node scripts/prepare-server-npm-package.ts

      - name: Apply brand assets
        shell: bash
        run: |
          brand=production
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dist_tag }}" = "nightly" ]; then
            brand=nightly
          fi
          node scripts/apply-web-brand-assets.ts "$brand" release/npm-server/dist/client

      - name: Dry-run npm package
        working-directory: release/npm-server
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack-dry-run.log
          grep -q "dist/client/index.html" /tmp/npm-pack-dry-run.log

      # Install the packed tarball the way a real `npx @threadlines/server` user
      # would (fresh tree, registry-resolved transitive deps) and require it to
      # boot. Catches what the tarball grep cannot: dependency skew like the
      # 0.3.1 release, where a peer range resolved to a second copy of effect
      # and the server exited 1 before printing anything. Telemetry is off so
      # each throwaway boot doesn't count as a new installation in PostHog.
      - id: smoke_pack
        name: Pack and smoke test artifact
        shell: bash
        env:
          THREADLINES_TELEMETRY_ENABLED: "false"
        run: |
          set -euo pipefail
          pack_dir="$GITHUB_WORKSPACE/release/npm-server"
          tarball="$(cd "$pack_dir" && npm pack --silent)"
          version="$(node -p 'require(process.argv[1]).version' "$pack_dir/package.json")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm install --no-audit --no-fund --loglevel=error "$pack_dir/$tarball"
          effect_copies="$(find node_modules -path '*node_modules/effect/package.json' | wc -l)"
          if [ "$effect_copies" -ne 1 ]; then
            echo "Expected exactly one installed copy of effect, found $effect_copies:"
            find node_modules -path '*node_modules/effect/package.json'
            exit 1
          fi
          node node_modules/@threadlines/server/dist/bin.mjs --port 7777 --no-browser --base-dir "$smoke_dir/home" > server.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 30); do
            if grep -q "Listening on http" server.log; then
              echo "Server booted."
              kill "$server_pid" || true
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server process exited before becoming ready. Log:"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          echo "Server did not become ready within 30s. Log:"
          cat server.log
          kill "$server_pid" || true
          exit 1

      - name: Upload tested npm tarball
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-server-tarball
          path: release/npm-server/${{ steps.smoke_pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish package
    needs: pack
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ needs.pack.outputs.version }}
    steps:
      # npm OIDC trusted publishing requires npm 11.5+ (Node 24). Skipping cache
      # and install keeps this step to a few seconds while keeping the same Node.
      - name: Setup Node 24
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: false
          run-install: false

      - name: Download tested npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-server-tarball
          path: ${{ runner.temp }}/npm-tarball

      - name: Publish to npm
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish "${RUNNER_TEMP}/npm-tarball/${TARBALL}" --access public --tag "$DIST_TAG"

  docker:
    name: Start the Docker image build
    needs: publish
    # The Docker image installs this npm version, so it builds once npm has
    # it. docker-image.yml can't listen for the GitHub release instead:
    # release.yml publishes the release with GITHUB_TOKEN, and GitHub doesn't
    # start workflows from that token's release events. A workflow_dispatch
    # like this one is exempt.
    if: ${{ inputs.dist_tag == 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch docker-image.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Docker images only build from plain stable versions; skipping '${VERSION}'."
            exit 0
          fi
          gh workflow run docker-image.yml \
            --ref "$REF" \
            -f version="$VERSION" \
            -f tag_latest=true
          echo "Dispatched the Docker image build for ${VERSION} from ${REF}."
