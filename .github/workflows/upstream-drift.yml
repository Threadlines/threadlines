name: Upstream Drift

# Versions we pin by hand in code (Antigravity, managed Node.js, the ACP and
# Codex protocol schemas) that Dependabot can't see. Opens one issue per pin
# that is behind its vendor, keeps it current, and closes it once we catch up.
# See scripts/check-upstream-drift.ts.

on:
  schedule:
    # Mondays 12:23 UTC: 07:23 ET in winter, 08:23 in summer. Off the hour
    # because GitHub queues top-of-the-hour crons the longest.
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  check:
    name: Check pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the default branch, even when run by hand from another one:
      # a pin bumped on an unmerged branch must not close its issue.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: false

      # The script imports the server modules that hold two of the pins.
      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check pins and sync issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/check-upstream-drift.ts --apply
