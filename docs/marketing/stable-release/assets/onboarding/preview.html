<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Threadlines first-run setup</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 24px auto;
      max-width: 1400px;
      padding: 0 20px;
      background: #111;
      color: #eee;
      font: 15px system-ui;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    p {
      color: #aaa;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      margin: 20px 0 32px;
    }
    .square {
      max-width: 720px;
    }
  </style>
  <h1>First-run setup</h1>
  <p>Recreated setup state. No installation, sign-in, or prompt submission occurs in this clip.</p>
  <video
    controls
    preload="metadata"
    poster="onboarding-landscape-poster.png"
    src="onboarding-landscape.mp4"
  ></video>
  <video
    class="square"
    controls
    preload="metadata"
    poster="onboarding-square-poster.png"
    src="onboarding-square.mp4"
  ></video>
</html>
