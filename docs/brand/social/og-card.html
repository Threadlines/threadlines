<!doctype html>
<!--
  The site's social card (apps/marketing/public/og.png) and the README header.
  Render at 2400x1260, device scale 1, and save over og.png. The screenshot is the
  full-window studio capture (public/Screenshots/app/two-agents.webp), so re-render
  whenever that capture changes.

  GitHub's social preview (repo Settings › General › Social preview, uploaded by
  hand) is the same render cropped to 2400x1200 around the middle and scaled to
  1280x640: docs/brand/social/github-social-preview.png.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=2400, initial-scale=1" />
    <title>Threadlines social card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 2400px;
        height: 1260px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #09090b;
        color: #fafafa;
        font-family:
          "Hanken Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .ambient {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 70% 8%, oklch(0.62 0.19 264 / 0.16), transparent 38%),
          radial-gradient(circle at 8% 92%, oklch(0.62 0.19 264 / 0.08), transparent 34%),
          linear-gradient(180deg, #0d0d10 0%, #09090b 40%);
      }

      .copy {
        position: absolute;
        top: 104px;
        left: 104px;
        width: 760px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .brand svg {
        width: 106px;
        height: 58px;
      }

      .brand-name {
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      h1 {
        margin: 92px 0 0;
        font-size: 92px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.04em;
      }

      h1 span {
        color: oklch(0.7 0.17 264);
      }

      .sub {
        margin: 40px 0 0;
        color: #a1a1aa;
        font-size: 38px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.015em;
      }

      .facts {
        position: absolute;
        bottom: 104px;
        left: 104px;
        color: #71717a;
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 26px;
        letter-spacing: 0.02em;
      }

      .shot {
        position: absolute;
        top: 222px;
        right: 96px;
        width: 1400px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        background: #1c1c1e;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="copy">
      <div class="brand">
        <svg viewBox="36 86 184 100" fill="none" aria-hidden="true">
          <defs>
            <linearGradient
              id="og-glyph-live"
              gradientUnits="userSpaceOnUse"
              x1="108"
              y1="98"
              x2="194"
              y2="162"
            >
              <stop offset="0" stop-color="#a1a1aa" stop-opacity="0.45" />
              <stop offset="1" stop-color="oklch(0.7 0.17 264)" />
            </linearGradient>
          </defs>
          <g stroke-linecap="round" stroke-width="10">
            <path d="M 44 98 L 212 98" stroke="#ffffff" stroke-opacity="0.32" />
            <path d="M 108 98 C 134 98 134 162 160 162 L 188 162" stroke="url(#og-glyph-live)" />
          </g>
          <g fill="#ffffff" fill-opacity="0.45">
            <circle cx="70" cy="98" r="7" />
            <circle cx="108" cy="98" r="8.5" />
            <circle cx="178" cy="98" r="7" />
          </g>
          <circle cx="194" cy="162" r="21" fill="oklch(0.7 0.17 264)" fill-opacity="0.16" />
          <circle cx="194" cy="162" r="12.5" fill="oklch(0.7 0.17 264)" />
        </svg>
        <span class="brand-name">Threadlines</span>
      </div>
      <h1>Your coding agents, <span>together in one thread.</span></h1>
      <p class="sub">An open-source ADE for Claude Code, Codex, OpenCode, Cursor and more.</p>
    </div>
    <p class="facts">Free · MIT · macOS, Windows, Linux</p>
    <main class="shot">
      <img src="../../../apps/marketing/public/Screenshots/app/two-agents.webp" alt="" />
    </main>
  </body>
</html>
