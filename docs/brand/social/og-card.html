<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=2400, initial-scale=1" />
    <title>Threadlines social card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 2400px;
        height: 1260px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #09090b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .ambient {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 76% 12%, rgba(110, 148, 250, 0.1), transparent 33%),
          linear-gradient(180deg, #0d0d10 0%, #09090b 34%);
      }

      .masthead {
        position: absolute;
        top: 42px;
        right: 72px;
        left: 72px;
        display: flex;
        height: 90px;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
      }

      .brand {
        display: flex;
        min-width: max-content;
        align-items: center;
        gap: 22px;
      }

      .brand svg {
        width: 106px;
        height: 58px;
      }

      .brand-name {
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .positioning {
        color: rgba(250, 250, 250, 0.7);
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.018em;
        white-space: nowrap;
      }

      .positioning strong {
        color: #8ca5ff;
        font-weight: 600;
      }

      .release {
        min-width: max-content;
        color: rgba(250, 250, 250, 0.42);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 25px;
        letter-spacing: 0.04em;
      }

      .workspace {
        position: absolute;
        top: 154px;
        right: 56px;
        bottom: 44px;
        left: 56px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        background: #1c1c1e;
      }

      .workspace img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <header class="masthead">
      <div class="brand">
        <svg viewBox="36 86 184 100" fill="none" aria-hidden="true">
          <defs>
            <linearGradient
              id="og-glyph-live"
              gradientUnits="userSpaceOnUse"
              x1="108"
              y1="98"
              x2="194"
              y2="162"
            >
              <stop offset="0" stop-color="#a1a1aa" stop-opacity="0.45" />
              <stop offset="1" stop-color="#6e94fa" />
            </linearGradient>
          </defs>
          <g stroke-linecap="round" stroke-width="10">
            <path d="M 44 98 L 212 98" stroke="#ffffff" stroke-opacity="0.32" />
            <path d="M 108 98 C 134 98 134 162 160 162 L 188 162" stroke="url(#og-glyph-live)" />
          </g>
          <g fill="#ffffff" fill-opacity="0.45">
            <circle cx="70" cy="98" r="7" />
            <circle cx="108" cy="98" r="8.5" />
            <circle cx="178" cy="98" r="7" />
          </g>
          <circle cx="194" cy="162" r="21" fill="#6e94fa" fill-opacity="0.16" />
          <circle cx="194" cy="162" r="12.5" fill="#6e94fa" />
        </svg>
        <span class="brand-name">Threadlines</span>
      </div>
      <div class="positioning">
        Agents, browser, and <strong>source control</strong>. One workspace.
      </div>
      <div class="release">v0.3.0</div>
    </header>
    <main class="workspace">
      <img
        src="../../../apps/marketing/public/Screenshots/launch/workspace-four-panel-overview.png"
        alt=""
      />
    </main>
  </body>
</html>
